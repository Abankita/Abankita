<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Abankita Behera">
  <title>Abankita Behera</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5f8"/>
      <stop offset="0.55" stop-color="#fde4ec"/>
      <stop offset="1" stop-color="#f7c1d3"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fde4ec"/>
      <stop offset="0.6" stop-color="#e8789f"/>
      <stop offset="1" stop-color="#9d4a68"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e8789f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e8789f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>

  <g fill="#9d4a68">
    <circle cx="48" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="255" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="30" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="265" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="48" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="270" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="28" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="40" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="965" cy="255" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="130" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#e8789f" stroke-opacity="0.45" stroke-width="1" fill="none">
    <polyline points="48,40 100,70 150,52 205,86"/>
  </g>
  <g fill="#e8789f">
    <circle cx="100" cy="70" r="2"/>
    <circle cx="150" cy="52" r="2"/>
    <circle cx="205" cy="86" r="2"/>
  </g>

  <circle cx="770" cy="150" r="90" fill="url(#glow)">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g transform="rotate(-18 770 150)">
    <ellipse cx="770" cy="150" rx="150" ry="50" fill="none" stroke="#e8789f" stroke-opacity="0.55" stroke-dasharray="2 6"/>
    <ellipse cx="770" cy="150" rx="215" ry="78" fill="none" stroke="#e8789f" stroke-opacity="0.35" stroke-dasharray="2 8"/>
    <circle r="6" fill="#9d4a68">
      <animateMotion dur="12s" repeatCount="indefinite" path="M920,150 A150,50 0 1,1 620,150 A150,50 0 1,1 920,150"/>
    </circle>
    <circle r="4" fill="#f7c1d3" stroke="#9d4a68" stroke-width="1.2">
      <animateMotion dur="22s" repeatCount="indefinite" path="M985,150 A215,78 0 1,1 555,150 A215,78 0 1,1 985,150"/>
    </circle>
  </g>
  <circle cx="770" cy="150" r="34" fill="url(#planet)"/>

  <text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#9d4a68">COMPUTATION · DATA · THE UNIVERSE</text>

  <text x="60" y="140" font-family="Georgia, 'Times New Roman', Times, 'DejaVu Serif', serif" font-style="italic" font-size="58" fill="#5b2a3c">Abankita Behera</text>

  <path d="M62 160 H420" stroke="#e8789f" stroke-width="1.2"/>

  <text x="60" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#9d4a68">B.TECH CSE · BPUT ROURKELA · 2023-27</text>

  <g font-family="Georgia, 'Times New Roman', Times, 'DejaVu Serif', serif" font-style="italic" font-size="22" fill="#7a3b52">
    <text x="60" y="240" opacity="1">computational astronomy
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.27;0.95;1" dur="16s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="240" opacity="0">multimodal deep learning
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="16s" begin="4s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="240" opacity="0">multi-agent systems
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="16s" begin="8s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="240" opacity="0">earth observation
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="16s" begin="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
